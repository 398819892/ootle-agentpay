[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpay-mcp"
version = "0.1.0"
description = "AgentPay MCP server — an on-chain, hard-limited wallet for AI agents (Tari Ootle)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "AgentPay" }]
keywords = ["mcp", "model-context-protocol", "tari", "ootle", "agent", "payments", "wallet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial",
]
# The only extra runtime dependency: the MCP framework. The on-chain SDK (`agentpay.onchain`)
# ships with this repo and is stdlib-only; it is bridged onto sys.path at runtime (repo layout
# or AGENTPAY_SDK_PATH) rather than pulled from PyPI, so it is intentionally not listed here.
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
agentpay-mcp = "agentpay_mcp.server:main"

[project.urls]
Homepage = "https://modelcontextprotocol.io"

[tool.setuptools]
packages = ["agentpay_mcp"]
