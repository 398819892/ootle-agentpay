[workspace]
[package]
name = "otc_board"
version = "0.1.0"
edition = "2024"
description = "A P2P OTC escrow board: sellers list assets, buyers take them through an on-chain Escrow"

[package.metadata.tari-template]
tags = ["otc", "escrow", "p2p", "marketplace"]
category = "defi"

[dependencies]
tari_template_lib = { version = "0.35" }
minicbor = { version = "2.2", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
tari_template_test_tooling = "0.47"
sha2 = "0.10"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
overflow-checks = true  # contracts: trap on integer overflow instead of silently wrapping (audit #3)
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2

[build-dependencies]
tari_ootle_template_build = "0.16"
