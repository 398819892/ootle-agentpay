[package]
name = "esme-fund"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "esme-fund"
path = "src/main.rs"

[dependencies]
# Versions must match the running walletd (tari_ootle_walletd 0.49.x). All three
# resolve from the local cargo registry cache in the WSL Ubuntu dev box.
tari_ootle_transaction = { version = "=0.49.2", features = ["serde"] }
tari_template_lib_types = { version = "=0.36.0", features = ["serde"] }
serde_json = "1"

[profile.dev]
debug = false
