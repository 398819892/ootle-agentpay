<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPay 控制台</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#15181d; --muted:#6b7280; --line:#e5e7eb;
    --accent:#4f46e5; --accent-ink:#ffffff; --ok:#15803d; --ok-bg:#dcfce7;
    --bad:#b91c1c; --bad-bg:#fee2e2; --bar:#e5e7eb; --barfill:#4f46e5;
    --chip:#eef2ff; --chip-ink:#4338ca; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1013; --card:#181b20; --ink:#e7e9ee; --muted:#9aa2af; --line:#2a2f37;
    --accent:#818cf8; --accent-ink:#13151a; --ok:#86efac; --ok-bg:#0f2a1a;
    --bad:#fca5a5; --bad-bg:#2a1414; --bar:#2a2f37; --barfill:#818cf8;
    --chip:#1e2130; --chip-ink:#a5b4fc;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1013; --card:#181b20; --ink:#e7e9ee; --muted:#9aa2af; --line:#2a2f37;
    --accent:#818cf8; --accent-ink:#13151a; --ok:#86efac; --ok-bg:#0f2a1a;
    --bad:#fca5a5; --bad-bg:#2a1414; --bar:#2a2f37; --barfill:#818cf8;
    --chip:#1e2130; --chip-ink:#a5b4fc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink);
    font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:#9ca3af}
  .dot.on{background:#22c55e} .dot.off{background:#ef4444}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){ .grid{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
    margin:0 0 12px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted);font-size:13px} .row .v{font-weight:600;font-variant-numeric:tabular-nums}
  .v.mono{font-family:var(--mono);font-weight:500;font-size:12px}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
  .barwrap{height:10px;background:var(--bar);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .barfill{height:100%;background:var(--barfill);transition:width .4s}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
    color:var(--ink);font-size:14px;font-family:var(--mono)}
  .btns{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .inline{display:flex;gap:8px;align-items:flex-end}
  .inline > div{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;transition:.12s;text-align:left}
  button:hover{border-color:var(--accent)} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.danger{color:var(--bad);border-color:var(--bad)}
  button small{display:block;font-weight:400;opacity:.7;font-size:11px;margin-top:2px}
  #flash{margin:14px 0;padding:0;max-height:0;overflow:hidden;transition:.25s;border-radius:10px;font-size:14px}
  #flash.show{padding:11px 14px;max-height:120px}
  #flash.ok{background:var(--ok-bg);color:var(--ok)} #flash.bad{background:var(--bad-bg);color:var(--bad)}
  .log{list-style:none;margin:0;padding:0;font-size:13px}
  .log li{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .log li:last-child{border-bottom:0}
  .log .mk{font-weight:700;flex-shrink:0;width:16px}
  .log .mk.ok{color:var(--ok)} .log .mk.bad{color:var(--bad)}
  .log .at{font-weight:600} .log .de{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .theme{margin-left:auto;font-size:12px;color:var(--muted);cursor:pointer;background:none;border:0;padding:4px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AgentPay 链上控制台</h1>
    <span class="badge"><span id="dot" class="dot"></span><span id="conn">连接中…</span></span>
    <button class="theme" id="themeBtn" title="切换深浅色">◐ 主题</button>
  </header>
  <p class="sub">点按钮替「AI 代理」付钱 —— 限额由本地链的验证节点强制执行,客户端绕不过去。</p>

  <div id="flash"></div>

  <div class="grid">
    <!-- 左:状态 -->
    <div class="card" id="rulesCard">
      <h2>预算规则 &amp; 余额</h2>
      <div id="rules"></div>
    </div>

    <!-- 右:操作 -->
    <div class="card">
      <h2>操作</h2>
      <div id="actions"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>链上流水 / 日志</h2>
    <ul class="log" id="log"><li class="empty">还没有操作。</li></ul>
  </div>

  <p class="sub" style="margin-top:20px">
    角色:所有者=本地链的 <code>default</code> 账户;shop=白名单商户;scammer=非白名单。
    每个按钮都会向 <code>127.0.0.1:12010</code> 的钱包守护进程提交真实交易。
  </p>
  <p class="sub" style="margin-top:6px">
    ℹ️ 提示:余额和每笔金额在链上<strong>公开</strong>(链保证"花不超限",不保证"花了别人看不见");
    限额/超时按 <strong>~30 分钟的 epoch</strong> 计,不是自然日。详见 <code>docs/security.md</code>。
  </p>
</div>

<script>
let S = null, busy = false, sig = '';
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':(''+s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const short = a => a ? a.slice(0,16)+'…' : '—';

// 主题切换(记忆到 localStorage)
try{ const t=localStorage.getItem('apc-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
$('#themeBtn').onclick = ()=>{
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('apc-theme', next); }catch(e){}
};

function flash(ok, msg){
  const f = $('#flash');
  f.className = 'show ' + (ok?'ok':'bad');
  f.textContent = (ok?'✓ ':'✗ ') + msg;
  clearTimeout(flash._t); flash._t = setTimeout(()=>{ f.className=''; }, 6000);
}

async function call(action, payload){
  setBusy(true);
  try{
    const r = await fetch('/api/'+action, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload||{})});
    const j = await r.json();
    if(j.state) { S = j.state; sig = sigOf(S); render(); }  // 操作后一定重绘
    return j;
  }catch(e){ flash(false, '请求失败:'+e); return {ok:false,reason:''+e}; }
  finally{ setBusy(false); }
}
function setBusy(b){ busy = b;
  document.querySelectorAll('button').forEach(x=>{ if(x.id!=='themeBtn') x.disabled=b; }); }

// 只在状态真的变了时才重绘 —— 否则别碰 DOM(不清空你正在输入的金额、不闪)
function sigOf(s){ const b=s.budget||{}; return [s.connected,s.owner_balance,s.shop_balance,
  b.component,b.spent,b.revoked,(s.log||[]).length].join('|'); }
async function refresh(){
  if(busy) return;                       // 操作进行中不刷新
  try{
    const r = await fetch('/api/state'); const ns = await r.json();
    const nsig = sigOf(ns);
    S = ns;
    if(nsig !== sig){ sig = nsig; render(); }
  }catch(e){ $('#conn').textContent='后台没响应'; }
}

function render(){
  if(!S) return;
  const on = S.connected;
  $('#dot').className = 'dot ' + (on?'on':'off');
  $('#conn').textContent = on ? '本地链已连接' : '未连接';

  if(!on){
    $('#rules').innerHTML = '<p class="empty">'+esc(S.reason||'本地链未连接。请确认本地 swarm 在运行(见 docs/devnet.md)。')+'</p>';
    $('#actions').innerHTML = '<p class="empty">链连上后这里会出现操作按钮。页面每几秒自动重试。</p>';
    return;
  }

  const b = S.budget;
  // ---- 规则 & 余额面板 ----
  const R = $('#rules');
  if(!b){
    R.innerHTML =
      row('所有者账户', short(S.owner), true) +
      (S.owner_balance!=null?row('所有者余额', fmt(S.owner_balance)+' tTARI'):'') +
      '<p class="empty">还没有预算。右边先「开预算」。</p>';
  }else{
    const pct = b.daily_cap? Math.min(100, Math.round(b.spent/b.daily_cap*100)) : 0;
    R.innerHTML =
      row('状态', b.revoked
            ? '<span class="pill bad">已撤销</span>'
            : '<span class="pill ok">生效中</span>') +
      row('单笔上限', fmt(b.per_tx_cap)) +
      row('每日上限', fmt(b.daily_cap)) +
      row('白名单', (b.whitelist&&b.whitelist.length?b.whitelist:['shop'])
            .map(n=>'<span class="pill" style="background:var(--chip);color:var(--chip-ink)">'+esc(n)+'</span>')
            .join(' ')) +
      '<div style="padding-top:10px">' +
        '<div class="k" style="color:var(--muted);font-size:13px">当日已花 / 每日上限</div>' +
        '<div class="barwrap"><div class="barfill" style="width:'+pct+'%"></div></div>' +
        '<div class="row" style="border:0;padding-top:2px"><span class="v big">'+fmt(b.spent)+
          '</span><span class="k">剩余额度 '+fmt(b.remaining)+'</span></div>' +
      '</div>' +
      row('合约金库余额', fmt(b.vault)) +
      row('shop 累计到账', S.shop_balance!=null? fmt(S.shop_balance)+' tTARI':'—') +
      row('预算合约', short(b.component), true);
  }

  // ---- 操作面板 ----
  const A = $('#actions');
  if(!b){
    A.innerHTML =
      field('fund','充值额(base units)','10000') +
      '<div class="inline">' +
        '<div>'+field('per_tx','单笔上限','1000')+'</div>' +
        '<div>'+field('daily','每日上限','1500')+'</div>' +
      '</div>' +
      '<div class="btns" style="margin-top:12px">' +
        '<button class="primary" onclick="doOpen()">开预算（上链创建合约）' +
          '<small>把钱锁进 AgentBudget 合约,并把规则写上链</small></button>' +
      '</div>';
  }else{
    const dis = b.revoked ? 'disabled' : '';
    A.innerHTML =
      '<div class="inline"><div>'+field('amt','付款金额','100')+'</div>' +
        '<button class="primary" style="flex:0 0 auto" '+dis+' onclick="doPay(\'shop\',amt())">付给 shop</button></div>' +
      '<div class="btns" style="margin-top:12px">' +
        '<button '+dis+' onclick="doPay(\'shop\',5000)">试试超额:付 5000 给 shop' +
          '<small>超过单笔上限,看链怎么拒</small></button>' +
        '<button '+dis+' onclick="doPay(\'scammer\',100)">试试'+(S.scammer_whitelisted?'':'非白名单:')+'付 100 给 scammer' +
          '<small>'+(S.scammer_whitelisted?'scammer 已在白名单,这笔现在会成功':'收款方不在白名单,看链怎么拒')+'</small></button>' +
        (S.scammer_whitelisted ? '' :
          '<button '+dis+' onclick="doAct(\'add_merchant\',\'加白名单\')">把 scammer 加入白名单' +
            '<small>所有者治理（链上 add_merchant）:加完后给 scammer 付款就不再被拒</small></button>') +
        '<button class="danger" '+dis+' onclick="doAct(\'revoke\',\'撤销代理\')">撤销代理（急停）' +
          '<small>之后任何付款都会被链拒绝</small></button>' +
        '<button onclick="doAct(\'withdraw\',\'提现\')">提现剩余到所有者</button>' +
        '<button onclick="doAct(\'reset\',\'新建\')">新建一个预算</button>' +
      '</div>';
  }

  // ---- 日志 ----
  const L = $('#log');
  if(!S.log || !S.log.length){ L.innerHTML = '<li class="empty">还没有操作。</li>'; }
  else{
    L.innerHTML = S.log.map(e =>
      '<li><span class="mk '+(e.ok?'ok':'bad')+'">'+(e.ok?'✓':'✗')+'</span>' +
      '<span><span class="at">'+esc(e.action)+'</span> — <span class="de">'+esc(e.detail)+'</span></span></li>'
    ).join('');
  }
}

function row(k,v,mono){ return '<div class="row"><span class="k">'+k+'</span>' +
  '<span class="v'+(mono?' mono':'')+'">'+v+'</span></div>'; }
function field(id,label,ph){ return '<label>'+label+'</label>' +
  '<input id="f_'+id+'" value="'+ph+'" inputmode="numeric">'; }
function fmt(n){ return (n==null?'—':(''+n).replace(/\B(?=(\d{3})+(?!\d))/g,',')); }
function fv(id){ return parseInt(($('#f_'+id)||{}).value||'0',10)||0; }
function amt(){ return fv('amt'); }

async function doOpen(){
  const j = await call('open', {fund:fv('fund'), per_tx:fv('per_tx'), daily:fv('daily')});
  flash(j.ok, j.ok? '预算已上链创建' : (j.reason||'失败'));
}
async function doPay(target, amount){
  if(!amount || amount<=0){ flash(false,'金额要大于 0'); return; }
  const j = await call('pay', {target, amount});
  flash(j.ok, j.ok ? ('付款成功:'+fmt(amount)+' → '+target)
                   : ('链拒绝:'+(j.reason||'')));
}
async function doAct(action, name){
  const j = await call(action, {});
  flash(j.ok, j.ok? (name+'成功') : (j.reason||'失败'));
}

refresh();
setInterval(()=>{ if(!document.hidden) refresh(); }, 8000);
</script>
</body>
</html>
