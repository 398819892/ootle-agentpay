# AgentPay dashboard — deployment topology.
#
# Run from the repo root:   docker compose -f web/docker-compose.yml up -d
# Put your secrets in an env file next to this one (web/.env); see web/.env.example.
#
# The important security property is the TOPOLOGY, not just the containers:
#
#   Internet ──HTTPS──▶ reverse proxy (Caddy/nginx, TLS) ──▶ dashboard:8787 ──▶ walletd:5100
#                                                            (hosted backend)   (holds the keys)
#
#   • Only the reverse proxy is exposed to the internet.
#   • `walletd` has NO published ports — it is reachable ONLY from the dashboard over the private
#     compose network. Its JSON-RPC port is never bound to a public interface.
#   • The dashboard requires a password (DASHBOARD_PASSWORD) — without it, it refuses to be safe.

services:
  dashboard:
    build:
      context: ..               # repo root, so clients/ts/dist is in the build context
      dockerfile: web/Dockerfile
    image: agentpay-dashboard
    restart: unless-stopped
    # Publish ONLY to localhost; a host reverse proxy (Caddy/nginx) terminates TLS in front of it.
    # Never publish this straight to 0.0.0.0 in production.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # --- auth (REQUIRED in production) ---
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in web/.env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in web/.env}
      # The container binds 0.0.0.0 (see Dockerfile HOST), so the server treats itself as
      # network-exposed and REFUSES to start unless a step-up secret DISTINCT from
      # DASHBOARD_PASSWORD is set. This is required, not optional, for this topology.
      AGENTPAY_ADMIN_PASSWORD: ${AGENTPAY_ADMIN_PASSWORD:?set AGENTPAY_ADMIN_PASSWORD (distinct from DASHBOARD_PASSWORD) in web/.env}
      COOKIE_SECURE: "true"     # the proxy terminates HTTPS, so cookies must be Secure
      # --- persistence: journal, audit log and idempotency claims MUST live on the volume ---
      # Their defaults are paths inside the image; left there they vanish on restart, which also
      # drops the cross-process claim markers that close the multi-instance double-spend (B-6).
      AGENTPAY_STATE_FILE: "/data/state.json"
      AGENTPAY_TXLOG_FILE: "/data/txlog.json"
      AGENTPAY_AUDIT_FILE: "/data/audit.log"
      AGENTPAY_CLAIMS_DIR: "/data/claims"
      # --- chain target: esmeralda public testnet ---
      AGENTPAY_WALLETD_URL: "http://walletd:5100/json_rpc"
      # No default: the esmeralda template must be (re)published from THIS repo's agent_budget and
      # its address set in web/.env. Do not hardcode a stale address — an old build with a different
      # `pay` signature makes every payment fail with an arg-count mismatch.
      AGENTPAY_BUDGET_TEMPLATE: ${AGENTPAY_BUDGET_TEMPLATE:?set AGENTPAY_BUDGET_TEMPLATE (your published agent_budget address) in web/.env}
      AGENTPAY_OWNER_ACCOUNT: ${AGENTPAY_OWNER_ACCOUNT:-dev}
    volumes:
      - dashboard-state:/data   # persist budget state, journal, audit log and claim markers
    networks:
      - agentpay
    depends_on:
      - walletd

  # ---------------------------------------------------------------------------------------------
  # walletd — the Tari Ootle wallet daemon. This is NOT a normal npm service: it needs the
  # `tari_ootle_walletd` binary, an esmeralda network config, a persistent keyring, and a funded
  # `dev` account. The block below is a TEMPLATE — see web/DEPLOYMENT.md for the full setup. Many
  # operators prefer to run walletd directly on the host instead (then point the dashboard at
  # AGENTPAY_WALLETD_URL=http://host.docker.internal:5100/json_rpc and delete this service).
  #
  # Whichever way you run it: bind it to localhost / the private network only, and NEVER publish
  # its port to the internet.
  walletd:
    image: debian:bookworm-slim
    restart: unless-stopped
    # NOTE: no `ports:` — intentional. walletd is reachable only from `dashboard` on the private
    # `agentpay` network, never from the host's public interface.
    environment:
      # walletd reads the keyring password from the environment; keep it out of logs and images.
      TARI_WALLET_DAEMON_KEYRING_PASSPHRASE: ${WALLETD_KEYRING_PASSWORD:?set WALLETD_KEYRING_PASSWORD in web/.env}
    volumes:
      # Supply the binary and the esmeralda config + keyring from the host (read the deploy doc).
      - ./walletd/tari_ootle_walletd:/usr/local/bin/tari_ootle_walletd:ro
      - walletd-data:/root/.tari
    # Bind inside the container to 0.0.0.0 so `dashboard` can reach it over the compose network;
    # because no port is published, this is still private to the compose network.
    command: >-
      /usr/local/bin/tari_ootle_walletd
      --network esmeralda
      --listen-addr 0.0.0.0:5100
    networks:
      - agentpay

networks:
  agentpay:
    driver: bridge

volumes:
  dashboard-state:
  walletd-data:
