<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>

    <meta
      name="description"
      content="AgentPay — a hosted dashboard for managing on-chain, validator-enforced spending budgets for AI agents on Tari Ootle."

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
