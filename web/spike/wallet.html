<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentPay Wallet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Euclid+Circular+A:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* A full L2 wallet in a MetaMask-style layout. Original mascot & branding (not MetaMask's logo). */
  :root{
    --bg:#ebedf0;--surface:#ffffff;--surface-2:#f7f8fa;--surface-3:#eef0f3;
    --border:#d6d9dc;--border-soft:#e7eaed;
    --fg:#1b1d21;--muted:#6a737d;--faint:#9099a2;
    --brand:#ef8e3b;--brand-2:#f6a04b;
    --blue:#0376c9;--blue-dark:#0260a4;--blue-bg:#eaf3fb;
    --good:#1c8234;--good-bg:#e7f6ec;--bad:#d73a49;--bad-bg:#fdecee;--warn:#b26a00;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -16px rgba(0,0,0,.35);
    color-scheme:light;
    --ui:"Euclid Circular A","Noto Sans SC",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  :lang(zh) h1,:lang(zh) h2,:lang(zh) h3,:lang(zh) .acctname{font-family:"Noto Sans SC",var(--ui);}
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .app{max-width:392px;margin:0 auto;min-height:100vh;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2,h3{margin:0;letter-spacing:-0.01em;} .mono{font-family:var(--mono);} .num{font-variant-numeric:tabular-nums;}
  button{font:inherit;cursor:pointer;}

  /* ---- top bar: network | account | menu ---- */
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:var(--surface);z-index:20;}
  .chipbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--fg);}
  .chipbtn:hover{border-color:var(--brand);}
  .chipbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg);}
  .chipbtn .car{color:var(--faint);font-size:10px;}
  .acctsel{margin:0 auto;}
  .ava{border-radius:50%;background:
      radial-gradient(circle at 30% 26%,#ffe0b0 0 24%,transparent 25%),
      radial-gradient(circle at 72% 34%,#8ab6e6 0 20%,transparent 21%),
      radial-gradient(circle at 42% 76%,#ef8e3b 0 30%,transparent 31%),
      conic-gradient(from 210deg,#e2761b,#f0a04b,#6ea8d8,#e2761b);}
  .ava.xs{width:20px;height:20px;} .ava.lg{width:50px;height:50px;box-shadow:0 0 0 4px var(--surface),0 1px 4px rgba(0,0,0,.22);}
  .iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--muted);font-size:18px;display:grid;place-items:center;line-height:1;}
  .iconbtn:hover{background:var(--surface-3);}
  .langbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--blue);}

  main{flex:1;overflow:auto;display:flex;flex-direction:column;}
  /* ---- balance hero ---- */
  .hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 16px 14px;}
  .addrchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface-3);border:1px solid var(--border-soft);border-radius:999px;padding:4px 11px;cursor:pointer;}
  .addrchip:hover{color:var(--fg);} .addrchip .ci{font-size:11px;}
  .bal{display:flex;align-items:baseline;gap:7px;margin-top:4px;} .bal .n{font-size:34px;font-weight:700;letter-spacing:-0.02em;} .bal .unit{font-size:15px;color:var(--muted);font-weight:600;}
  .balsub{font-size:12px;color:var(--faint);}
  .actions{display:flex;gap:22px;margin-top:10px;}
  .act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;color:var(--blue);font-size:11.5px;font-weight:600;}
  .act .circ{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;transition:background .15s;}
  .act:hover .circ{background:var(--blue-dark);}
  .act:disabled{color:var(--faint);} .act:disabled .circ{background:var(--surface-3);color:var(--faint);}

  .wrap{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px;}
  .link{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);background:var(--surface-3);border:1px solid var(--border-soft);border-radius:10px;padding:8px 11px;}
  .link .d{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;} .link.on{background:var(--good-bg);border-color:#bfe4c8;color:#1c6b30;} .link.on .d{background:var(--good);box-shadow:0 0 0 3px #28a7452a;} .link b{color:#146c2e;font-family:var(--mono);font-weight:600;word-break:break-all;}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-soft);padding:0 14px;position:sticky;top:53px;background:var(--surface);z-index:10;}
  .tab{border:0;background:transparent;padding:11px 6px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.on{color:var(--fg);border-bottom-color:var(--brand);}

  .lab{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;}
  /* token row */
  .tokenrow{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--border-soft);border-radius:13px;background:var(--surface);}
  .tokenrow:hover{border-color:var(--border);}
  .ticon{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--brand),#d9772e);display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0;}
  .tname{font-size:14px;font-weight:600;} .tnet{font-size:11.5px;color:var(--muted);}
  .tbal{margin-left:auto;text-align:right;} .tbal .v{font-family:var(--mono);font-size:14px;font-weight:600;} .tbal .s{font-size:11px;color:var(--faint);}

  .budget{border:1px solid var(--border-soft);border-radius:14px;background:var(--surface-2);padding:13px;display:flex;flex-direction:column;gap:11px;}
  .kv{display:flex;align-items:center;gap:10px;} .kv .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;min-width:52px;}
  .addr{font-size:12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:8px;padding:5px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;color:var(--muted);}
  .caps{display:grid;grid-template-columns:1fr 1fr;gap:9px;} .cap{background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:9px 11px;} .cap .val{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px;} .cap .muted{color:var(--faint);font-size:11px;}
  .meter{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border-soft);} .meter>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width .45s;} .meter.hot>span{background:linear-gradient(90deg,#f0a000,var(--bad));}
  .chips{display:flex;flex-wrap:wrap;gap:6px;} .chip{font-size:11px;font-family:var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;padding:3px 9px;} .chip b{color:var(--fg);}
  .muted{color:var(--muted);}
  .btn{font-weight:600;font-size:14px;color:#fff;background:var(--blue);border:0;border-radius:999px;padding:11px 16px;transition:background .15s;} .btn:hover{background:var(--blue-dark);}
  .btn.sec{background:var(--surface);color:var(--blue);border:1px solid var(--border);} .btn.sec:hover{background:var(--surface-3);}
  .btn.block{width:100%;} .btn:disabled{opacity:.5;cursor:progress;}

  /* activity */
  .activity{display:flex;flex-direction:column;gap:8px;}
  .arow{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--border-soft);border-radius:12px;background:var(--surface);}
  .aic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0;}
  .aic.out{background:var(--blue-bg);color:var(--blue);} .aic.no{background:var(--bad-bg);color:var(--bad);}
  .atitle{font-size:13px;font-weight:600;} .asub{font-size:11px;color:var(--muted);}
  .aamt{margin-left:auto;text-align:right;font-family:var(--mono);font-size:13px;font-weight:600;} .aamt.ok{color:var(--fg);} .aamt.no{color:var(--bad);}
  .empty{font-size:12px;color:var(--faint);text-align:center;padding:22px 10px;}
  .log{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:11px;padding:9px 11px;min-height:70px;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px;color:var(--muted);} .log .ln{display:flex;gap:8px;white-space:pre-wrap;word-break:break-word;} .log .t{color:var(--faint);flex-shrink:0;}
  .req{color:var(--blue);} .res{color:var(--good);} .rej{color:var(--bad);} .evt{color:var(--warn);} .sys{color:var(--muted);}
  .hint{font-size:11px;color:var(--faint);line-height:1.6;}

  /* ---- bottom sheets (send / receive) ---- */
  .sheet{position:absolute;inset:0;background:var(--surface);z-index:40;display:flex;flex-direction:column;animation:slideup .22s ease;}
  @keyframes slideup{from{transform:translateY(16px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border-soft);}
  .sheet-hd h2{font-size:15px;font-weight:700;} .sheet-hd .iconbtn{margin-left:auto;}
  .sheet-bd{flex:1;overflow:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:7px;} .field .lab{margin-bottom:1px;}
  .inbox{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:12px;padding:11px 13px;background:var(--surface);}
  .inbox input{border:0;outline:0;font:inherit;font-size:20px;font-family:var(--mono);width:100%;background:transparent;color:var(--fg);}
  .inbox .unit{color:var(--muted);font-weight:600;font-size:14px;}
  .to{display:flex;align-items:center;gap:10px;border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px;background:var(--surface-2);}
  .to .ava{width:30px;height:30px;flex-shrink:0;} .to .tn{font-size:13px;font-weight:600;} .to .ta{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all;}
  .presets{display:flex;flex-wrap:wrap;gap:7px;} .preset{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;} .preset.on{color:var(--blue);border-color:var(--blue);background:var(--blue-bg);}
  .qr{align-self:center;width:170px;height:170px;border-radius:14px;border:1px solid var(--border-soft);background:var(--surface-2);display:grid;place-items:center;padding:12px;}
  .bigaddr{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:12px;word-break:break-all;text-align:center;line-height:1.7;}
  .result{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:12px 0;}
  .result .big{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;} .result .big.ok{background:var(--good-bg);color:var(--good);} .result .big.no{background:var(--bad-bg);color:var(--bad);}

  /* ---- dropdown menus (network / account) ---- */
  .menu{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 40px -14px rgba(0,0,0,.4);padding:7px;min-width:220px;display:flex;flex-direction:column;gap:2px;}
  .menu .mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13px;color:var(--fg);background:transparent;border:0;text-align:left;width:100%;}
  .menu .mi:hover{background:var(--surface-3);} .menu .mi .r{margin-left:auto;color:var(--good);} .menu .mi.dim{color:var(--faint);} .menu .mi .ico{width:9px;height:9px;border-radius:50%;}
  .menu .sep{height:1px;background:var(--border-soft);margin:4px 2px;}
  .menu .mt{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 3px;}
  .scrim2{position:absolute;inset:0;z-index:44;}

  /* ---- dApp approval popups (relay) ---- */
  .scrim{position:fixed;inset:0;background:rgba(20,22,28,.45);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:60;}
  .modal{width:min(360px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5);overflow:hidden;max-height:92vh;overflow-y:auto;}
  .modal .top{padding:16px 18px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;border-bottom:1px solid var(--border-soft);}
  .modal .top h3{font-size:16px;font-weight:700;} .modal .top .pill{font-size:10.5px;background:var(--surface-3);border:1px solid var(--border-soft);color:var(--muted);border-radius:999px;padding:3px 9px;font-weight:600;}
  .mb{padding:15px 18px;display:flex;flex-direction:column;gap:13px;}
  .origin{font-size:12.5px;color:var(--blue);font-family:var(--mono);background:var(--blue-bg);border:1px solid #bfdcf3;border-radius:10px;padding:8px 11px;word-break:break-all;text-align:center;}
  .pay-amt{text-align:center;} .pay-amt .n{font-family:var(--mono);font-size:30px;font-weight:700;} .pay-amt .muted{font-size:13px;}
  .lab.center{text-align:center;}
  .checks{display:flex;flex-direction:column;gap:7px;} .check{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 11px;border-radius:10px;border:1px solid var(--border-soft);background:var(--surface-2);} .check .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff;} .check.ok .ic{background:var(--good);} .check.ok{border-color:#bfe4c8;background:var(--good-bg);} .check.no .ic{background:var(--bad);} .check.no{border-color:#f3c2c7;background:var(--bad-bg);} .check .lab2{flex:1;} .check .q{color:var(--muted);font-family:var(--mono);font-size:11px;}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px 18px;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="chipbtn" id="netBtn"><span class="dot"></span><span id="netName">Ootle Localnet</span><span class="car">▾</span></button>
    <button class="chipbtn acctsel" id="acctBtn"><span class="ava xs"></span><span class="acctname" id="acctNameTop" data-i18n="acctName">账户 1</span><span class="car">▾</span></button>
    <button class="langbtn" id="langBtn">EN</button>
    <button class="iconbtn" id="menuBtn">⋮</button>
  </header>

  <main>
    <section class="hero">
      <div class="ava lg"></div>
      <div class="addrchip" id="acctAddr" title="copy">… <span class="ci">⧉</span></div>
      <div class="bal"><span class="n num" id="bal">0</span><span class="unit">XTR</span></div>
      <div class="balsub" id="balSub" data-i18n="balSub">本窗口可用额度</div>
      <div class="actions">
        <button class="act" id="receiveBtn"><span class="circ">↓</span><span data-i18n="receive">接收</span></button>
        <button class="act" id="sendBtn"><span class="circ">↑</span><span data-i18n="send">发送</span></button>
      </div>
    </section>

    <div class="tabs">
      <button class="tab on" data-tab="tokens" data-i18n="tokens">代币</button>
      <button class="tab" data-tab="activity" data-i18n="activity">活动</button>
    </div>

    <div class="wrap">
      <div class="link" id="linkRow"><span class="d"></span><span id="linkText" data-i18n="noLink">尚无 dApp 连接</span></div>

      <div id="tab-tokens" style="display:flex;flex-direction:column;gap:12px">
        <div class="tokenrow">
          <div class="ticon">◇</div>
          <div><div class="tname">Tari XTR</div><div class="tnet" data-i18n="onOotle">Ootle L2 · localnet</div></div>
          <div class="tbal"><div class="v num"><span id="tokBal">0</span></div><div class="s" data-i18n="spendable">可支配</div></div>
        </div>

        <div id="budgetBox" hidden>
          <div class="lab" data-i18n="budget">预算 · AgentBudget</div>
          <div class="budget">
            <div class="kv"><span class="k" data-i18n="budgetK">合约</span><span class="addr mono" id="budgetAddr"></span></div>
            <div class="kv" id="payerRow" hidden><span class="k" data-i18n="payerK">会话账户</span><span class="addr mono" id="payerAddr" title="dApp 的付款与 gas 都由这个独立账户承担,不动钱包余额"></span></div>
            <div class="caps">
              <div class="cap"><div class="lab" data-i18n="perTxCap">单笔上限</div><div class="val num"><span id="perTx">—</span> <span class="muted">XTR</span></div></div>
              <div class="cap"><div class="lab" data-i18n="dailyCap">每日上限</div><div class="val num"><span id="daily">—</span> <span class="muted">XTR</span></div></div>
            </div>
            <div><div class="kv" style="justify-content:space-between;font-size:12px;margin-bottom:6px"><span class="muted" data-i18n="spent">本窗口已花</span><span class="mono num"><span id="spent">0</span> / <span id="daily2">—</span></span></div><div class="meter" id="meter"><span id="bar"></span></div></div>
            <div class="chips"><span class="chip"><span data-i18n="vault">金库</span> <b id="vault">—</b> XTR</span><span class="chip"><span data-i18n="wl">白名单</span> <b id="wlN">0</b></span></div>
          </div>
        </div>
        <div id="noBudget" hidden><button class="btn sec block" id="openBtn" data-i18n="openBtn">链上开一个预算(5000 · 额度 1000/1500)</button></div>
      </div>

      <div id="tab-activity" hidden style="flex-direction:column;gap:12px">
        <div class="activity" id="activityList"></div>
        <div class="lab" data-i18n="bridgeLog">桥接日志</div>
        <div class="log" id="log"></div>
      </div>

      <p class="hint" data-i18n="hint">这是独立的钱包窗口。dApp 不持有私钥,只能经 window.tari 向这里发请求;由你批准,钱包在本机签名并提交到链上。</p>
    </div>
  </main>

  <!-- send sheet -->
  <div class="sheet" id="sheetSend" hidden>
    <div class="sheet-hd"><h2 data-i18n="sendTitle">发送 XTR</h2><button class="iconbtn" data-close="sheetSend">✕</button></div>
    <div class="sheet-bd" id="sendBody"></div>
  </div>
  <!-- receive sheet -->
  <div class="sheet" id="sheetReceive" hidden>
    <div class="sheet-hd"><h2 data-i18n="receiveTitle">接收</h2><button class="iconbtn" data-close="sheetReceive">✕</button></div>
    <div class="sheet-bd" id="receiveBody"></div>
  </div>
  <!-- menus -->
  <div class="scrim2" id="menuScrim" hidden></div>
  <div class="menu" id="netMenu" hidden></div>
  <div class="menu" id="acctMenu" hidden></div>
</div>

<script>
  // Original flat fox mascot (NOT MetaMask's logo).
  function foxSVG(px){return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    +'<path d="M6 6 L15.5 11 L9 15.5 Z" fill="#d9772e"/><path d="M34 6 L24.5 11 L31 15.5 Z" fill="#d9772e"/>'
    +'<path d="M8 12 Q20 9.6 32 12 L28.4 24 Q20 32.4 11.6 24 Z" fill="#f0912f"/>'
    +'<path d="M15 17 Q20 18 25 17 L22.2 26 Q20 29 17.8 26 Z" fill="#fff6ec"/>'
    +'<circle cx="15.4" cy="18.4" r="1.7" fill="#2b2b33"/><circle cx="24.6" cy="18.4" r="1.7" fill="#2b2b33"/>'
    +'<path d="M18.5 24 L21.5 24 L20 26.3 Z" fill="#2b2b33"/></svg>';}

  const T={

  const inflight=new Set();
  async function resolveReq(id,result,error){try{await fetch("/bridge/resolve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,result,error})});}catch(e){}inflight.delete(id);}
  async function handleReq(q){
    const origin=q.origin||"(unknown)";
    if(q.method==="tari_requestAccounts"){
      log("req",t("reqAccts",origin));
      const ok=await approveConnect(origin);
      if(!ok){log("rej",t("connRej"));addActivity({kind:"connect",sub:origin,status:"failed"});return resolveReq(q.id,null,"user rejected connect (4001)");}
      const s=ST||await refresh(); setLinked(origin); addActivity({kind:"connect",sub:origin,status:"ok"});
      log("res",t("resAccts",short(s.account))); return resolveReq(q.id,[s.account]);
    }
    if(q.method==="tari_signAndSubmitTransaction"&&q.params&&q.params.pay){
      const amount=q.params&&q.params.pay&&q.params.pay.amount; log("req",t("reqPay",fmt(amount)));
      if(!ST||!ST.budget){log("rej","no budget");return resolveReq(q.id,null,"wallet has no budget open");}
      const okToSign=await approvePay(amount,origin);
      if(!okToSign){log("rej",t("userRej"));return resolveReq(q.id,null,"user rejected (4001)");}
      log("sys",t("signing"));
      try{
        const r=await api("/api/pay","POST",{amount,memo:(q.params.pay&&q.params.pay.memo)||"Caravel"});
        if(r.committed){(r.events||[]).forEach(ev=>log("evt",t("ev",ev)));log("res",t("commit",fmt(r.prevSpent),fmt(r.spent)));log("res",t("resPaid"));addActivity({kind:"pay",sub:t("viaDapp",origin),amount:r.amount,status:"ok"});}
        else{log("rej",t("payRej"));log("rej",t("resDecl",(r.reason||"").slice(0,42)));addActivity({kind:"pay",sub:t("viaDapp",origin),amount:r.amount,status:"failed"});}
        await refresh(); return resolveReq(q.id,r);
      }catch(err){log("rej",err.message);return resolveReq(q.id,null,err.message);}
    }
    if(q.method==="tari_signAndSubmitTransaction"&&q.params&&q.params.setLimits){
      const sl=q.params.setLimits; log("req",L==="zh"?"请求改限额":"set-limits request");
      if(!ST||!ST.budget){log("rej","no budget");return resolveReq(q.id,null,"wallet has no budget open");}
      const ok=await approveOwnerOp(L==="zh"?"修改额度":"Change limits",[{lab:L==="zh"?"单笔上限":"Per-tx cap",val:fmt(sl.perTxCap)+" XTR"},{lab:L==="zh"?"每日上限":"Daily cap",val:fmt(sl.dailyCap)+" XTR"}],origin);
      if(!ok){log("rej",t("userRej"));return resolveReq(q.id,null,"user rejected (4001)");}
      log("sys",t("signing"));
      try{const r=await api("/api/limits","POST",{perTxCap:String(sl.perTxCap),dailyCap:String(sl.dailyCap)});log("res",L==="zh"?"额度已更新":"limits updated");addActivity({kind:"owner",sub:t("viaDapp",origin),status:"ok"});await refresh();return resolveReq(q.id,r);}catch(err){log("rej",err.message);addActivity({kind:"owner",sub:t("viaDapp",origin),status:"failed"});return resolveReq(q.id,null,err.message);}
    }
    if(q.method==="tari_signAndSubmitTransaction"&&q.params&&(q.params.addMerchant||q.params.removeMerchant)){
      const adding=!!q.params.addMerchant; const m=((q.params.addMerchant||q.params.removeMerchant)||{}).merchant;
      log("req",adding?(L==="zh"?"请求加白名单":"add-merchant request"):(L==="zh"?"请求移出白名单":"remove-merchant request"));
      if(!ST||!ST.budget){log("rej","no budget");return resolveReq(q.id,null,"wallet has no budget open");}
      if(!m||!String(m).startsWith("component_")){return resolveReq(q.id,null,"merchant must be a component_ address");}
      const ok=await approveOwnerOp(adding?(L==="zh"?"加入白名单":"Whitelist merchant"):(L==="zh"?"移出白名单":"Remove merchant"),[{lab:L==="zh"?"商户":"Merchant",val:short(m)}],origin);
      if(!ok){log("rej",t("userRej"));return resolveReq(q.id,null,"user rejected (4001)");}
      log("sys",t("signing"));
      try{const r=await api(adding?"/api/merchant/add":"/api/merchant/remove","POST",{merchant:m});log("res",adding?(L==="zh"?"已加入白名单":"merchant added"):(L==="zh"?"已移出白名单":"merchant removed"));addActivity({kind:"owner",sub:t("viaDapp",origin),status:"ok"});await refresh();return resolveReq(q.id,r);}catch(err){log("rej",err.message);addActivity({kind:"owner",sub:t("viaDapp",origin),status:"failed"});return resolveReq(q.id,null,err.message);}
    }
    if(q.method==="tari_getBudget"||q.method==="tari_getState"){
      // READ over the relay: no signing, no approval modal — just hand a LINKED dApp the budget it
      // displays, so a non-custodial dashboard shows (and pays against) THIS wallet's on-chain budget.
      // Gate on the linked origin and throttle the chain re-read so a polling dApp can't hammer the indexer.
      if(!linkedOrigin||origin!==linkedOrigin){return resolveReq(q.id,null,"connect the wallet first (4100)");}
      try{
        if(!ST||Date.now()-lastRefresh>2500)await refresh();
        return resolveReq(q.id,{account:ST.account,network:ST.network,merchant:ST.merchant,template:ST.template,agentAccount:ST.agentAccount,twoAccount:ST.twoAccount,linkedOrigin:ST.linkedOrigin,budget:ST.budget});
      }catch(err){return resolveReq(q.id,null,err.message);}
    }
    return resolveReq(q.id,null,"unsupported method "+q.method);
  }
  async function drain(){let r;try{r=await fetch("/bridge/poll");}catch(e){return;}if(!r.ok)return;const {reqs}=await r.json();for(const q of reqs){if(inflight.has(q.id))continue;inflight.add(q.id);handleReq(q);}}

    const body=$("sendBody");
    body.innerHTML=
      '<div class="field"><div class="lab">'+esc(t("to"))+'</div><div class="to"><span class="ava"></span><div><div class="tn">'+esc(t("merchantName"))+'</div><div class="ta">'+esc(short(ST?ST.merchant:""))+'</div></div></div></div>'
      +'<div class="field"><div class="lab">'+esc(t("amount"))+'</div><div class="inbox"><input id="sendInput" type="number" min="1" value="'+sendAmt+'"><span class="unit">XTR</span></div>'
      +'<div class="presets" id="sendPresets">'+[300,700,900,5000].map(v=>'<button class="preset'+(v===sendAmt?" on":"")+'" data-v="'+v+'">'+v+'</button>').join("")+'</div></div>'
      +'<div class="hint">'+esc(L==="zh"?"这是从你自己的账户余额转出的付款,直接上链 —— 与 AgentBudget(dApp 的额度)互不相干,不会一起减少。":"This pays from your own account balance, straight on-chain — separate from the AgentBudget (the dApp's allowance); the two never decrease together.")+'</div>'
      +'<button class="btn block" id="sendGo" '+(ST?"":"disabled")+'>'+esc(t("continue"))+'</button>';
    $("sendPresets").addEventListener("click",(e)=>{const p=e.target.closest(".preset");if(!p)return;sendAmt=+p.dataset.v;$("sendInput").value=sendAmt;document.querySelectorAll("#sendPresets .preset").forEach(x=>x.classList.toggle("on",x===p));});
    $("sendInput").addEventListener("input",(e)=>{sendAmt=parseInt(e.target.value)||0;document.querySelectorAll("#sendPresets .preset").forEach(x=>x.classList.toggle("on",+x.dataset.v===sendAmt));});
    $("sendGo").onclick=doSend;
  }
  async function doSend(){
    const amount=sendAmt; if(!(amount>0))return;
    const ok=await approveSend(amount); if(!ok)return;
    const body=$("sendBody"); body.innerHTML='<div class="result"><div class="big ok" style="background:var(--surface-2);color:var(--blue)">…</div><div>'+esc(t("sending"))+'</div></div>';
    try{
      const r=await api("/api/send","POST",{amount,memo:"wallet send"});
      if(r.committed){addActivity({kind:"send",sub:t("viaSelf"),amount:r.amount,status:"ok"});body.innerHTML='<div class="result"><div class="big ok">✓</div><h3>'+esc(t("sent"))+'</h3><div class="pay-amt"><span class="n num">'+fmt(r.amount)+'</span> <span class="muted">XTR</span></div><div class="asub">'+esc(t("sentOwner",fmt(r.prevBalance),fmt(r.balance)))+'</div></div><button class="btn block" id="sdone">'+esc(t("done"))+'</button>';}
      else{addActivity({kind:"send",sub:t("viaSelf"),amount:r.amount,status:"failed"});body.innerHTML='<div class="result"><div class="big no">✕</div><h3>'+esc(t("failed"))+'</h3><div class="note">'+esc((r.reason||"").slice(0,80))+'</div></div><button class="btn block" id="sdone">'+esc(t("done"))+'</button>';}
      $("sdone").onclick=()=>{closeSheet("sheetSend");renderSend();};
      await refresh();
    }catch(e){body.innerHTML='<div class="result"><div class="big no">✕</div><div class="note">'+esc(e.message)+'</div></div><button class="btn block" id="sdone">'+esc(t("done"))+'</button>';$("sdone").onclick=()=>{closeSheet("sheetSend");renderSend();};}
  }
  $("sendBtn").onclick=()=>{if($("sendBtn").disabled)return;renderSend();openSheet("sheetSend");};

  // ---- receive sheet ----
  function renderReceive(){
    const a=ST?ST.account:""; const body=$("receiveBody");
    body.innerHTML='<div class="result" style="gap:14px"><div class="ava lg"></div><div class="acctname" style="font-weight:600">'+esc(t("acctName"))+'</div><div class="qr">'+foxSVG(80)+'</div><div class="bigaddr">'+esc(a)+'</div></div><button class="btn block" id="copyBtn">'+esc(t("copy"))+'</button><p class="note">'+esc(t("receiveHint"))+'</p>';
    $("copyBtn").onclick=async()=>{const ok=await copyText(a);$("copyBtn").textContent=ok?t("copied"):"⚠";setTimeout(()=>$("copyBtn").textContent=t("copy"),1400);};
  }
  $("receiveBtn").onclick=()=>{renderReceive();openSheet("sheetReceive");};

  // ---- menus ----
  function openMenu(which,anchor){
    const m=$(which); const other=which==="netMenu"?"acctMenu":"netMenu"; $(other).hidden=true;
    if(which==="netMenu"){m.innerHTML='<div class="mt">'+esc(t("netMenuTitle"))+'</div>'
      +'<button class="mi"><span class="ico" style="background:var(--good)"></span>'+esc(t("netLocal"))+'<span class="r">✓</span></button>'
      +'<button class="mi dim"><span class="ico" style="background:var(--faint)"></span>'+esc(t("netTest"))+'</button>'
      +'<button class="mi dim"><span class="ico" style="background:var(--faint)"></span>'+esc(t("netMain"))+'</button>';}
    else{const a=ST?ST.account:""; m.innerHTML='<div class="mt">'+esc(t("acctMenuTitle"))+'</div>'
      +'<button class="mi" id="miCopy"><span class="ava xs"></span><span class="acctname">'+esc(t("acctName"))+'</span><span class="r mono" style="color:var(--muted);font-size:11px">'+esc(short(a))+'</span></button>'
      +'<div class="sep"></div><div class="mt">'+esc(t("sites"))+'</div><button class="mi'+(linkedOrigin?'':' dim')+'" id="miSite"'+(linkedOrigin?' title="'+esc(t("disconnect"))+'"':'')+'>'+esc(linkedOrigin||t("noSites"))+(linkedOrigin?'<span class="r" style="color:var(--muted);font-size:11px">✕</span>':'')+'</button>'
      +'<div class="sep"></div><button class="mi dim">'+esc(t("settings"))+'</button><button class="mi dim">'+esc(t("lock"))+'</button>';}
    m.hidden=false; $("menuScrim").hidden=false;
    const r=anchor.getBoundingClientRect(); const ar=$("app")?0:0;
    m.style.top=(anchor.offsetParent?anchor.offsetTop+anchor.offsetHeight+6:r.bottom+6)+"px";
    m.style.left=Math.max(8,Math.min(r.left, (document.querySelector(".app").clientWidth)-m.offsetWidth-8))+"px";
    if(which==="acctMenu"){const c=$("miCopy");if(c)c.onclick=async()=>{await copyText(ST?ST.account:"");closeMenus();};
      const si=$("miSite");if(si&&linkedOrigin)si.onclick=async()=>{const o=linkedOrigin;try{await fetch("/bridge/unlink",{method:"POST"});}catch(e){}setLinked(null);log("res",t("disconnected")+" · "+o);closeMenus();};}
  }
  function closeMenus(){$("netMenu").hidden=true;$("acctMenu").hidden=true;$("menuScrim").hidden=true;}
  $("menuScrim").onclick=closeMenus;
  $("netBtn").onclick=(e)=>{e.stopPropagation();openMenu("netMenu",$("netBtn"));};
  $("acctBtn").onclick=(e)=>{e.stopPropagation();openMenu("acctMenu",$("acctBtn"));};
  $("menuBtn").onclick=(e)=>{e.stopPropagation();openMenu("acctMenu",$("menuBtn"));};
  $("acctAddr").onclick=async()=>{const ok=await copyText(ST?ST.account:"");const ci=$("acctAddr").querySelector(".ci");if(ci){ci.textContent="✓";setTimeout(()=>ci.textContent="⧉",1200);}};

  $("openBtn").onclick=async()=>{$("openBtn").disabled=true;try{const r=await api("/api/open","POST",{fund:5000,perTx:1000,daily:1500,epochsPerWindow:10});log("res",t("opened",short(r.address)));await refresh();}catch(e){log("rej",e.message);$("openBtn").disabled=false;}};
  $("langBtn").onclick=()=>{L=(L==="zh")?"en":"zh";try{localStorage.setItem("ap-lang",L);}catch{};applyLang();setLinked(linkedOrigin);renderActivity();};

  // init
  (function initAva(){document.querySelectorAll(".ava").forEach(a=>{});})();
  applyLang(); setLinked(null); renderActivity();
  refresh().catch(e=>log("rej",e.message));
</script>
</body>
</html>
