# Continuous Integration for the Ootle AgentPay / OTC Escrow DApp.
#
# STATUS: running on GitHub Actions (github.com/398819892/ootle-agentpay). Runs on a standard
#   `ubuntu-latest` runner and mirrors the suites that pass locally (see `make ci` /
#   scripts/ci-local.sh and docs/ci.md).
#
# It runs the same suites as the local CI, but each in its own job for clear, cached,
# parallel feedback:
#   1. templates  — cargo test for the three Rust→WASM Tari templates (wasmer, Linux only)
#   2. sdk        — pytest for the Python SDK (ootle-agentpay)
#   3. mcp        — pytest for the MCP server backend (integrations/agentpay_mcp)
#   4. web        — every web/server/*.test.js (the dashboard's zero-dependency Node suites)
#   5. ts-client  — a clean `tsc` build + the TS client's node --test suites
#
# Why Linux only: the Tari engine's template test tooling pins wasmer's cranelift backend,
# which does not compile on Windows/macOS (see docs/devnet.md). Upstream tari-project CI is
# ubuntu-only for the same reason.
#
# NOT run here: the real on-chain e2e (scripts/e2e_onchain_pay.py, `make e2e`). It needs a live
# Tari swarm to make a CONFIRMED payment, which a GitHub runner has not got, so it is an opt-in
# integration test (RUN_E2E=1) that the swarm-free CI skips rather than fakes. See docs/ci.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ templates
  templates:
    name: templates (cargo test · ${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [escrow, agent_budget, otc_board]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (+ wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache the cargo registry + the per-template build dir. The template test tooling
      # compiles the template to wasm and runs it in wasmer in-process, so a warm target/
      # makes repeat runs dramatically faster (the first run is a cold build).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            templates/${{ matrix.template }}/target
          key: cargo-${{ runner.os }}-${{ matrix.template }}-${{ hashFiles(format('templates/{0}/Cargo.toml', matrix.template)) }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.template }}-

      - name: cargo test
        working-directory: templates/${{ matrix.template }}
        # Build against the COMMITTED Cargo.lock with --locked: a reproducible build that fails if the
        # lock and Cargo.toml disagree, rather than re-resolving to floating latest versions each run.
        # The old `generate-lockfile` + `cargo update -p tari_crypto --precise 0.24.0` dance was both
        # non-reproducible AND broken: every current tari_template_test_tooling 0.49.x requires
        # tari_crypto ^0.24.1, so the 0.24.0 downgrade turned unsatisfiable and the job failed at
        # resolution. All 99 template tests pass against the committed lock's 0.24.1 (the old
        # "doesn't build against 0.24.1" note no longer holds for test_tooling 0.49.2).
        run: cargo test --locked

  # ------------------------------------------------------------------ Python SDK
  sdk:
    name: sdk (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ootle-py (a transitive dep of the SDK, used by tests/test_keys.py) requires Python >=3.13.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the SDK (with its deps + pytest)
        working-directory: sdk
        # Installs ootle-agentpay and its dependency ootle-py so the FULL suite — including
        # tests/test_keys.py — runs on the runner. If ootle-py cannot be resolved on the runner,
        # drop this line's `.[dev]` extra and run pytest with --continue-on-collection-errors
        # (as the local CI does on the dev box, where Python is 3.12 and ootle-py is absent).
        run: pip install -e ".[dev]" pytest-asyncio

      - name: pytest
        working-directory: sdk
        # test_keys.py needs ootle-py (not resolvable on the runner); skip it here — it runs
        # on a dev box that has ootle-py. All other suites must pass.
        run: python -m pytest -q --ignore=tests/test_keys.py

  # ------------------------------------------------------------------ MCP server
  mcp:
    name: mcp (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The backend/config tests stub the SDK and import only `agentpay_mcp.{backend,config}` plus the
      # SDK's `agentpay` (resolved via the test's own sys.path to ../../../sdk/src) — no `mcp` framework
      # and no network needed. pytest's exit code gates the job (no grep-for-"failed" masking).
      - name: Install pytest
        run: pip install pytest

      - name: pytest (MCP backend + config)
        working-directory: integrations/agentpay_mcp
        run: python -m pytest -q tests

  # ------------------------------------------------------------------ web dashboard
  web:
    name: web (node security tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # Zero dependencies: each suite boots the real server (Node built-ins only) on a random port
      # against throwaway state, landing before any chain call (no walletd needed). We run EVERY
      # web/server/*.test.js by glob rather than a hand-maintained list, so a newly added suite
      # (multitenant, xff_proxy, csrf_noauth, session_reconcile, …) can never be silently left out of
      # CI. Each script exits non-zero on failure; we run them all, then fail if any did. Mirrors
      # scripts/ci-local.sh run_web.
      - name: node test suites
        working-directory: web
        run: |
          failed=0
          for t in server/*.test.js; do
            echo "::group::$t"
            node "$t" || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more web/server test suites failed"
            exit 1
          fi

  # ------------------------------------------------------------------ TS client
  ts-client:
    name: clients/ts (tsc build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # Gate: a clean type-checked compile of the committed sources, then the manifest-injection
      # test suite (node's built-in runner, no extra deps). typescript + @types/node are the only
      # (dev) deps.
      # `npm ci` (not `npm install`): installs exactly the committed package-lock.json and fails if
      # package.json and the lock disagree — a reproducible, lock-respecting build. typescript +
      # @types/node are the only (dev) deps.
      - name: Install dev deps
        working-directory: clients/ts
        run: npm ci --no-audit --no-fund

      - name: tsc build
        working-directory: clients/ts
        run: npm run build

      - name: Verify dist was produced
        working-directory: clients/ts
        run: test -f dist/index.js

      # The dashboard runs with no build step, so dist/ is committed on purpose (see .gitignore).
      # That only stays safe if the committed dist/ actually matches the current src/: a stale dist/
      # would ship behaviour the type-check never saw. Fail the build if `tsc` produced anything that
      # differs from what is committed. (The compiled *test* artifacts are gitignored, hence untracked,
      # so `git diff` ignores them; this guards only the tracked, shipped dist/*.js and *.d.ts.)
      - name: dist/ is in sync with src/
        working-directory: clients/ts
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::clients/ts/dist is out of date — run 'npm run build' in clients/ts and commit the result."
            exit 1
          fi

      - name: Run tests (manifest-injection guard)
        working-directory: clients/ts
        run: node --test dist/*.test.js
